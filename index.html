<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة المصطفى</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #00838f;
            --accent-color: #00acc1;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 { margin: 0; font-size: 1.4rem; }
        .header-btns { display: flex; gap: 15px; }
        .icon-btn { background: none; border: none; color: white; font-size: 1.3rem; cursor: pointer; position: relative; }
        .badge { position: absolute; top: -5px; right: -8px; background: #e53935; color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.7rem; font-weight: bold; }

        .search-bar { padding: 15px 20px; background: white; }
        .search-bar input { width: 100%; padding: 10px 15px; border: 1px solid #ddd; border-radius: 20px; outline: none; box-sizing: border-box; }

        .categories { display: flex; overflow-x: auto; padding: 10px 20px; gap: 10px; background: white; border-bottom: 1px solid #eee; }
        .cat-btn { padding: 8px 16px; border: 1px solid var(--primary-color); border-radius: 20px; background: none; color: var(--primary-color); white-space: nowrap; cursor: pointer; }
        .cat-btn.active { background: var(--primary-color); color: white; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 20px; }
        .product-card { background: var(--card-bg); border-radius: var(--border-radius); overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .product-img { width: 100%; height: 140px; object-fit: cover; background: #eee; }
        .product-info { padding: 10px; text-align: center; }
        .product-title { font-size: 0.95rem; margin: 5px 0; font-weight: bold; }
        .product-price { color: var(--primary-color); font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; }
        .add-to-cart-btn { background: var(--primary-color); color: white; border: none; padding: 8px; width: 100%; border-radius: 0 0 var(--border-radius) var(--border-radius); cursor: pointer; }
        .like-btn { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.8); border: none; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #888; }
        .like-btn.liked { color: #e53935; }

        .sidebar { position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: white; box-shadow: -2px 0 10px rgba(0,0,0,0.1); transition: 0.3s; z-index: 1001; padding: 20px; box-sizing: border-box; }
        .sidebar.active { right: 0; }
        .close-sidebar { background: none; border: none; font-size: 1.5rem; cursor: pointer; float: left; }

        .auth-section { margin-top: 30px; padding: 15px; background: #f9f9f9; border-radius: 8px; text-align: center; }
        .btn-google { background: #4285F4; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .user-code-badge { background: #e0f7fa; color: #006064; padding: 5px 10px; border-radius: 4px; font-weight: bold; display: inline-block; margin-top: 5px; }

        .cart-modal { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-radius: 20px 20px 0 0; box-shadow: 0 -4px 15px rgba(0,0,0,0.1); transform: translateY(100%); transition: 0.3s; z-index: 1000; padding: 20px; box-sizing: border-box; max-height: 80vh; overflow-y: auto; }
        .cart-modal.active { transform: translateY(0); }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .cart-item-qty { display: flex; gap: 8px; align-items: center; }
        .qty-btn { background: #eee; border: none; width: 25px; height: 25px; border-radius: 4px; cursor: pointer; }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDzL37FIGSHqOBLw7iccszX4aAGVEv-NEo",
            authDomain: "almustafa-bookstore.firebaseapp.com",
            projectId: "almustafa-bookstore",
            storageBucket: "almustafa-bookstore.firebasestorage.app",
            messagingSenderId: "744070396193",
            appId: "1:744070396193:web:0d845dee1457e0f528e660",
            measurementId: "G-G84WD2REEM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.currentUser = null;
        window.userCode = null;

        function generate6DigitCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        onAuthStateChanged(auth, async (user) => {
            const authContainer = document.getElementById('auth-container');
            if (user) {
                window.currentUser = user;
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    window.userCode = userSnap.data().userCode;
                } else {
                    window.userCode = generate6DigitCode();
                    await setDoc(userRef, {
                        uid: user.uid,
                        name: user.displayName,
                        email: user.email,
                        photo: user.photoURL,
                        userCode: window.userCode,
                        createdAt: new Date().toISOString()
                    });
                }

                authContainer.innerHTML = `
                    <p>مرحباً، <strong>${user.displayName}</strong></p>
                    <p>كود الزبون: <span class="user-code-badge">#${window.userCode}</span></p>
                    <button class="btn-google" style="background:#e53935;" id="logout-btn">تسجيل الخروج</button>
                `;
                document.getElementById('logout-btn').onclick = () => signOut(auth);
            } else {
                window.currentUser = null;
                window.userCode = null;
                authContainer.innerHTML = `<button class="btn-google" id="login-btn"><i class="fab fa-google"></i> تسجيل الدخول بجوجل</button>`;
                document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
            }
        });

        window.db = db;
    </script>
</head>
<body>

    <header>
        <h1>مكتبة المصطفى</h1>
        <div class="header-btns">
            <button class="icon-btn" onclick="toggleCart()"><i class="fas fa-shopping-cart"></i><span class="badge" id="cart-count">0</span></button>
            <button class="icon-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        </div>
    </header>

    <div class="search-bar">
        <input type="text" id="search-input" placeholder="ابحث عن منتج..." oninput="filterProducts()">
    </div>

    <div class="categories">
        <button class="cat-btn active" onclick="filterCategory('الكل', this)">الكل</button>
        <button class="cat-btn" onclick="filterCategory('القرطاسية والأقلام', this)">القرطاسية والأقلام</button>
        <button class="cat-btn" onclick="filterCategory('باقات المدارس', this)">باقات المدارس</button>
        <button class="cat-btn" onclick="filterCategory('الألعاب', this)">الألعاب</button>
        <button class="cat-btn" onclick="filterCategory('الهدايا', this)">الهدايا</button>
        <button class="cat-btn" onclick="filterCategory('الطواقي', this)">الطواقي</button>
        <button class="cat-btn" onclick="filterCategory('الإكسسوارات', this)">الإكسسوارات</button>
        <button class="cat-btn" onclick="filterCategory('الورد والتغليف', this)">الورد والتغليف</button>
    </div>

    <div class="products-grid" id="products-container"></div>

    <!-- القائمة الجانبية -->
    <div class="sidebar" id="sidebar">
        <button class="close-sidebar" onclick="toggleSidebar()">&times;</button>
        <h3>القائمة</h3>
        <p><i class="fas fa-map-marker-alt"></i> قباسين - شارع احموش</p>
        <p><i class="fab fa-whatsapp"></i> 963712835990+</p>
        <hr>
        <div class="auth-section" id="auth-container">
            جاري التحميل...
        </div>
    </div>

    <!-- نافذة السلة -->
    <div class="cart-modal" id="cart-modal">
        <h3>سلة الشراء</h3>
        <div id="cart-items"></div>
        <h4>المجموع: <span id="cart-total">0</span> ل.س</h4>
        <button class="btn-google" style="background:#25D366; margin-top:10px;" onclick="checkoutWhatsApp()">إرسال الطلب عبر الواتساب <i class="fab fa-whatsapp"></i></button>
        <button class="btn-google" style="background:#888; margin-top:5px;" onclick="toggleCart()">إغلاق</button>
    </div>

    <script>
        const products = [
            { id: 1, name: "دفتر 60 ورق", price: 3000, category: "القرطاسية والأقلام", img: "https://via.placeholder.com/150" },
            { id: 2, name: "قلم حبر أزرق", price: 1000, category: "القرطاسية والأقلام", img: "https://via.placeholder.com/150" },
            { id: 3, name: "باقة الصف الأول كاملة", price: 45000, category: "باقات المدارس", img: "https://via.placeholder.com/150" },
            { id: 4, name: "سيارة أطفال ذكية", price: 25000, category: "الألعاب", img: "https://via.placeholder.com/150" },
            { id: 5, name: "ساعة يد أنيقة", price: 35000, category: "الإكسسوارات", img: "https://via.placeholder.com/150" },
            { id: 6, name: "طاقية شتوية", price: 12000, category: "الطواقي", img: "https://via.placeholder.com/150" },
            { id: 7, name: "تغليف هدايا فاخر مع ورد", price: 15000, category: "الورد والتغليف", img: "https://via.placeholder.com/150" }
        ];

        let cart = [];
        let currentCategory = 'الكل';

        function renderProducts(list) {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            list.forEach(p => {
                container.innerHTML += `
                    <div class="product-card">
                        <button class="like-btn" onclick="toggleLike(${p.id}, this)"><i class="fas fa-heart"></i></button>
                        <img src="${p.img}" class="product-img" alt="${p.name}">
                        <div class="product-info">
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">${p.price.toLocaleString()} ل.س</div>
                        </div>
                        <button class="add-to-cart-btn" onclick="addToCart(${p.id})">إضافة للسلة</button>
                    </div>
                `;
            });
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = products.filter(p => {
                const matchCat = currentCategory === 'الكل' || p.category === currentCategory;
                const matchSearch = p.name.toLowerCase().includes(query);
                return matchCat && matchSearch;
            });
            renderProducts(filtered);
        }

        function addToCart(id) {
            const item = cart.find(i => i.id === id);
            if (item) { item.qty++; } 
            else { cart.push({ ...products.find(p => p.id === id), qty: 1 }); }
            updateCartUI();
        }

        function updateCartQty(id, change) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += change;
                if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            }
            updateCartUI();
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total').innerText = total.toLocaleString();

            const itemsContainer = document.getElementById('cart-items');
            itemsContainer.innerHTML = '';
            cart.forEach(item => {
                itemsContainer.innerHTML += `
                    <div class="cart-item">
                        <div>${item.name} (${item.price.toLocaleString()} ل.س)</div>
                        <div class="cart-item-qty">
                            <button class="qty-btn" onclick="updateCartQty(${item.id}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="updateCartQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function toggleCart() { document.getElementById('cart-modal').classList.toggle('active'); }
        function toggleLike(id, btn) { btn.classList.toggle('liked'); }

        async function checkoutWhatsApp() {
            if (cart.length === 0) { alert('السلة فارغة!'); return; }
            let total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let message = "سلام عليكم، أريد طلب المنتجات التالية:\n";
            cart.forEach(item => { message += `- ${item.name} (العدد: ${item.qty})\n`; });
            message += `المجموع: ${total.toLocaleString()} ل.س\n`;

            if (window.currentUser && window.userCode) {
                message += `كود الزبون: #${window.userCode}`;
                
                // حفظ الطلب في Firestore
                try {
                    const { collection, addDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
                    await addDoc(collection(window.db, "orders"), {
                        userCode: window.userCode,
                        userId: window.currentUser.uid,
                        userName: window.currentUser.displayName,
                        items: cart,
                        totalPrice: total,
                        date: new Date().toISOString()
                    });
                } catch(e) { console.error("Error adding doc: ", e); }
            } else {
                message += `الطلب بواسطة: زائر`;
            }

            const phone = "963712835990";
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        renderProducts(products);
    </script>
</body>
</html>

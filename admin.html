<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم إدارة مكتبة المصطفى</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #00838f;
      --accent-color: #00acc1;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      direction: rtl;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .header h2 { margin: 0; font-size: 1.6rem; }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    button.btn-search {
      padding: 12px 25px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      transition: 0.2s;
    }

    button.btn-search:hover {
      background-color: #006064;
    }

    .user-info p {
      font-size: 1.05rem;
      margin: 8px 0;
      border-bottom: 1px dashed #eee;
      padding-bottom: 8px;
    }

    .user-info strong {
      color: var(--primary-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid #eee;
      padding: 10px;
      text-align: right;
    }

    th {
      background-color: #f9f9f9;
      color: var(--primary-color);
    }

    .badge-code {
      background-color: #e0f7fa;
      color: #006064;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDzL37FIGSHqOBLw7iccszX4aAGVEv-NEo",
      authDomain: "almustafa-bookstore.firebaseapp.com",
      projectId: "almustafa-bookstore",
      storageBucket: "almustafa-bookstore.firebasestorage.app",
      messagingSenderId: "744070396193",
      appId: "1:744070396193:web:0d845dee1457e0f528e660",
      measurementId: "G-G84WD2REEM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.searchCustomer = async function() {
      const inputVal = document.getElementById('search-code').value.trim();
      const code = inputVal.replace('#', '');
      const resultDiv = document.getElementById('result');
      
      if (!code) {
        resultDiv.innerHTML = '<div class="card"><p style="color:red;">يرجى إدخال الكود المكون من 6 أرقام.</p></div>';
        return;
      }

      resultDiv.innerHTML = '<div class="card"><p><i class="fas fa-spinner fa-spin"></i> جاري البحث عن بيانات الزبون والطلبات...</p></div>';

      try {
        // 1. البحث عن بيانات الزبون
        const qUser = query(collection(db, "users"), where("userCode", "==", code));
        const userSnap = await getDocs(qUser);

        if (userSnap.empty) {
          resultDiv.innerHTML = '<div class="card"><p style="color:red; font-weight:bold;"><i class="fas fa-exclamation-triangle"></i> لم يتم العثور على زبون مسجل بهذا الكود (# ' + code + ')</p></div>';
          return;
        }

        let userData = null;
        userSnap.forEach(doc => userData = doc.data());

        // 2. البحث عن طلبات الزبون
        const qOrders = query(collection(db, "orders"), where("userCode", "==", code));
        const orderSnap = await getDocs(qOrders);

        let ordersHTML = '';
        orderSnap.forEach(doc => {
          const order = doc.data();
          const orderDate = new Date(order.date).toLocaleString('ar-EG');
          const itemsList = order.items.map(i => `${i.name} (عدد: ${i.qty})`).join(' ، ');

          ordersHTML += `<tr>
            <td>${orderDate}</td>
            <td><strong>${order.totalPrice.toLocaleString()} ل.س</strong></td>
            <td>${itemsList}</td>
          </tr>`;
        });

        const createdDate = new Date(userData.createdAt).toLocaleString('ar-EG');

        resultDiv.innerHTML = `
          <div class="card user-info">
            <h3 style="margin-top:0; color:var(--primary-color);"><i class="fas fa-id-card"></i> بيانات الزبون:</h3>
            <p><strong>كود الزبون:</strong> <span class="badge-code">#${userData.userCode}</span></p>
            <p><strong>الاسم كامل:</strong> ${userData.name}</p>
            <p><strong>البريد الإلكتروني:</strong> ${userData.email}</p>
            <p><strong>تاريخ أول تسجيل دخول:</strong> ${createdDate}</p>
          </div>

          <div class="card">
            <h3 style="margin-top:0; color:var(--primary-color);"><i class="fas fa-history"></i> سجل طلبات الزبون عبر الموقع:</h3>
            ${ordersHTML ? `
              <table>
                <thead>
                  <tr>
                    <th>تاريخ الطلب</th>
                    <th>إجمالي المبلغ</th>
                    <th>المنتجات المطلوبة</th>
                  </tr>
                </thead>
                <tbody>
                  ${ordersHTML}
                </tbody>
              </table>
            ` : '<p style="color:#666;">لا توجد طلبات مسجلة سابقة بهذا الكود.</p>'}
          </div>
        `;
      } catch (error) {
        console.error("Error searching:", error);
        resultDiv.innerHTML = '<div class="card"><p style="color:red;">حدث خطأ أثناء البحث، حاول مرة أخرى.</p></div>';
      }
    };
  </script>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2><i class="fas fa-user-shield"></i> لوحة تحكم مكتبة المصطفى</h2>
      <p style="margin:5px 0 0 0; font-size:0.9rem; opacity:0.9;">نظام استعلام الكود للتعرف على الزبائن والطلبات</p>
    </div>

    <div class="card">
      <label for="search-code" style="font-weight:bold; font-size:1.05rem;">أدخل كود الزبون (المكون من 6 أرقام):</label>
      <div class="search-box">
        <input type="text" id="search-code" placeholder="مثال: 739201">
        <button class="btn-search" onclick="searchCustomer()"><i class="fas fa-search"></i> بحث</button>
      </div>
    </div>

    <div id="result"></div>
  </div>

</body>
</html>
